# DISABLED TEMPLATE: enable when outside contributors arrive.
# The project currently enforces checks locally with git hooks (.githooks/, scripts/setup-dev.sh).
# To enable: copy this file to .github/workflows/ci.yml. macOS runners on a private repository
# consume Actions minutes at a higher rate than Linux runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Local gate (forbidden patterns)
        run: bash scripts/check.sh
